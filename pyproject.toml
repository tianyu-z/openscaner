[project]
name = "openscaner-benchmark"
version = "0.1.0"
description = "CPU document-boundary model benchmark"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<5",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "python-multipart>=0.0.20,<1",
  "safetensors>=0.5,<1",
  "scikit-image>=0.24,<1",
  "timm>=0.9,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]
ml = [
  "mobile-sam @ git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2",
  "onnx>=1.17,<2",
  "ultralytics>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openscaner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_models: opt-in smoke tests that load locally downloaded model weights",
]
